---
docker:
  image: maxonfjvipon/rultor-image-js:latest
install: |
  npm install --no-color
  npm install --no-color mocha
  pdd -f /dev/null -v
release:
  pre: false
  script: |-
    [[ "${tag}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit -1
    npm test
    npm run coverage
merge:
  script: |-
    npm test
    npm run coverage
